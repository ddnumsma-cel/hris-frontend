name: msma-hris

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: msma
      POSTGRES_PASSWORD: msma_local_dev
      POSTGRES_DB: msma_hris
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - msma_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U msma -d msma_hris']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  msma_pgdata:
