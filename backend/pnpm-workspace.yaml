packages:
  - apps/*
  - packages/*

# React Native / Expo (Metro) works most reliably with a flat node_modules.
nodeLinker: hoisted

# pnpm only runs install scripts for packages approved here.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
  esbuild: true
  '@scarf/scarf': false # install telemetry, not needed

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.0'
  - '@tanstack/react-query@5.104.0'
